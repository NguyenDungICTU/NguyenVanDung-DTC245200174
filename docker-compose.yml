
services:
  app:
    build: ./app
    container_name: quiz-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:-day3-demo-secret-change-me}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  db:
    image: mysql:8.4
    container_name: quiz-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend_net

  phpmyadmin:
    image: phpmyadmin:5
    container_name: quiz-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    # Publish phpMyAdmin on host port 8081. Binding without a host IP
    # avoids loopback-only publishing issues on some Docker Desktop setups.
    # Development use only: this may expose phpMyAdmin to your local network.
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  nginx:
    image: nginx:1.27-alpine
    container_name: quiz-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - frontend_net

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: quiz-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - cadvisor
      - mysqld-exporter
    networks:
      - monitoring_net

  grafana:
    image: grafana/grafana:12.1.1
    container_name: quiz-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring_net
      - logging_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    container_name: quiz-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring_net

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    container_name: quiz-mysqld-exporter
    restart: unless-stopped
    command:
      - "--config.my-cnf=/cfg/.my.cnf"
    volumes:
      - ./monitoring/.my.cnf:/cfg/.my.cnf:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
      - monitoring_net

  loki:
    image: grafana/loki:3.7.8
    container_name: quiz-loki
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./logging/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - logging_net
      - monitoring_net

  promtail:
    image: grafana/promtail:3.5.0
    container_name: quiz-promtail
    restart: unless-stopped
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - ./logging/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/tmp
    depends_on:
      - loki
    networks:
      - logging_net

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:

networks:
  frontend_net:
  backend_net:
    internal: true
  monitoring_net:
  logging_net:
