services:
  app:
    build: ./app
    container_name: quiz-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:-day3-demo-secret-change-me}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  db:
    image: mysql:8.4
    container_name: quiz-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend_net

  phpmyadmin:
    image: phpmyadmin:5
    container_name: quiz-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    # Lab/demo database admin UI; app itself remains behind Nginx.
    ports:
      - "8080:80"
    networks:
      - backend_net

  nginx:
    image: nginx:1.27-alpine
    container_name: quiz-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - frontend_net

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: quiz-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
      - mysqld-exporter
    networks:
      - monitoring_net

  grafana:
    image: grafana/grafana:12.1.1
    container_name: quiz-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    container_name: quiz-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring_net

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    container_name: quiz-mysqld-exporter
    restart: unless-stopped
    command:
      - "--config.my-cnf=/cfg/.my.cnf"
    volumes:
      - ./monitoring/.my.cnf:/cfg/.my.cnf:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
      - monitoring_net

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

networks:
  frontend_net:
  backend_net:
    internal: true
  monitoring_net:
