services:
  app:
    build: ./app
    container_name: quiz-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:-day3-demo-secret-change-me}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  db:
    image: mysql:8.4
    container_name: quiz-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend_net

  phpmyadmin:
    image: phpmyadmin:5
    container_name: quiz-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    # Keep this only for lab/demo DB inspection; Nginx is the app entrypoint.
    ports:
      - "8080:80"
    networks:
      - backend_net

  nginx:
    image: nginx:1.27-alpine
    container_name: quiz-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - frontend_net

volumes:
  mysql_data:

networks:
  frontend_net:
  backend_net:
    internal: true
